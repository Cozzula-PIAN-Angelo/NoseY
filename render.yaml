# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.
# Servizi: nosey-db (database), nosey-be (backend), nosey-fe (frontend).

databases:
  - name: nosey-db
    databaseName: nosey
    user: nosey
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: nosey-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    # Pubblico anche con Spring Security (progettazione v4, sezione 14 e D19).
    healthCheckPath: /api/stato
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nosey-db
          property: connectionString
      # Origine del FE, es. https://nosey-fe.onrender.com (senza / finale, identica a quella
      # che vede il browser). Vale per il CORS e anche per l'handshake WebSocket su /ws:
      # se e' sbagliata, l'API funziona a meta' e il WebSocket viene rifiutato.
      - key: ALLOWED_ORIGIN
        sync: false
      # Chiave di firma dei JWT: Render la genera casuale al primo deploy.
      - key: JWT_SECRET
        generateValue: true
      # Durata del token. Facoltativa: senza, il BE usa 24h (formato Duration, es. 24h, 30m).
      - key: JWT_DURATA
        value: 24h
      # Chiave di Google Gemini per il miglioramento della descrizione (decisione 18).
      - key: GEMINI_API_KEY
        sync: false
      # Email (decisione 12): con il profilo "prod" gira BrevoEmailService, che invia via API HTTP
      # (Render gratuito blocca SMTP). Senza il profilo gira LogEmailService, che scrive i codici
      # nel log ("[EMAIL FINTA] ... codice="): serve solo per provare in locale.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Chiave API di Brevo (SMTP e API > Chiavi API): una API key, non una SMTP key.
      - key: BREVO_API_KEY
        sync: false
      # Mittente delle email: deve essere un indirizzo confermato in Brevo (Mittenti), identico.
      # Con "prod" attivo e queste due vuote l'email non parte e si scrive un errore nel log.
      - key: MAIL_FROM
        sync: false
      # Le immagini stanno nel database (decisione 4): niente Cloudinary.
      # SUPERADMIN_EMAIL non esiste ancora.

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: nosey-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://nosey-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
