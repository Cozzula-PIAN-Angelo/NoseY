# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.
# Servizi: nosey-db (database), nosey-be (backend), nosey-fe (frontend).

databases:
  - name: nosey-db
    databaseName: nosey
    user: nosey
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: nosey-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    # Pubblico anche con Spring Security (progettazione v4, sezione 14 e D19).
    healthCheckPath: /api/stato
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nosey-db
          property: connectionString
      # Origine del FE per il CORS, es. https://nosey-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Chiave di firma dei JWT: Render la genera casuale al primo deploy.
      - key: JWT_SECRET
        generateValue: true
      # Chiave di Google Gemini per il miglioramento della descrizione (decisione 18).
      - key: GEMINI_API_KEY
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: nosey-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://nosey-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
