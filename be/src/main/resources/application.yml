spring:
  application:
    name: nosey

  # Autenticazione solo con JWT (TokenService): niente utente in memoria con password generata.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    # In locale valgono i valori dopo i due punti. Su Render DatabaseUrl legge
    # DATABASE_URL e sovrascrive queste tre proprieta'.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/NoseY-DB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mvc:
    # I devtools lo accendono in locale: Spring scriverebbe nel log ogni eccezione gestita,
    # e per la validazione anche il valore rifiutato (es. una password troppo corta, in chiaro).
    log-resolved-exception: false

  # Limiti sull'upload (progettazione v4, sezione 0): oltre max-file-size/max-request-size
  # -> MaxUploadSizeExceededException -> 400 FILE_NON_VALIDO (GestoreErrori).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Usata solo da SmtpEmailService (profilo "smtp"): con LogEmailService (default)
  # queste proprieta' restano inutilizzate.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Render assegna la porta in PORT.
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Oltre questo limite Tomcat puo' chiudere la connessione prima del 400
    # (sezione 0): il frontend controlla comunque tipo e dimensione prima di inviare.
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # In produzione: ALLOWED_ORIGIN=https://<fe>.onrender.com (piu' valori separati da virgola).
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173}
  jwt:
    # Nessun default: un segreto scritto qui sarebbe pubblico. Almeno 32 caratteri (HS256).
    # In locale va impostato nella configurazione di avvio (variabile d'ambiente JWT_SECRET).
    secret: ${JWT_SECRET}
    durata: ${JWT_DURATA:24h}
  # Miglioramento della descrizione con Google Gemini (decisione 18). Senza chiave l'endpoint
  # risponde 502 SERVIZIO_ESTERNO. Chiave da https://aistudio.google.com/apikey
  ai:
    api-key: ${GEMINI_API_KEY:}
    modello: ${AI_MODELLO:gemini-3.5-flash}
    url: https://generativelanguage.googleapis.com/v1beta
    timeout: 30s
  # Limiti di frequenza in memoria (progettazione v4, sezione 0): si azzerano a ogni riavvio.
  # Finestra che scorre: "al giorno" = nelle ultime 24 ore. I limiti sui codici via email
  # non sono qui, stanno nel database (UTENTE).
  limiti:
    login-falliti:
      massimo: 10
      finestra: 15m
    ai:
      massimo: 10
      finestra: 1h
    iscrizioni:
      massimo: 20
      finestra: 24h
    richieste-amicizia:
      massimo: 30
      finestra: 24h
    notifiche-manuali:
      massimo: 5
      finestra: 24h
    messaggi-chat:
      massimo: 30
      finestra: 1m
