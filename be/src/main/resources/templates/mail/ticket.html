<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>

	<title>Il tuo ticket</title>

<body style="margin:0; padding:0; background-color:#0f131d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f131d" style="background-color:#0f131d; width:100%;">
	<tr>
		<td align="center" style="padding:32px 16px;">

				<tr>
					<td align="center" style="padding:28px 24px 20px 24px; border-bottom:1px solid rgba(255,255,255,0.08);">
						<table role="presentation" cellpadding="0" cellspacing="0" border="0">
							<tr>
								<td valign="middle" style="padding-right:10px;">
									<img src="https://nosey-fe.onrender.com/logo-nosey.png" alt="" width="32" height="32" style="display:block; width:32px; height:32px;"/>
								</td>
								<td valign="middle">

								</td>
							</tr>
						</table>
					</td>
				</tr>

					</td>
				</tr>

										</tr>

							</tr>

									<p style="margin:0 0 2px 0; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#ddb374;">Titolare</p>
									<p style="margin:0 0 18px 0; font-size:15px; color:#f6dca0;" th:text="${nome}">nome</p>

															</tr>

															</tr>

															</tr>

															</tr>

											<td valign="middle">
												<p style="margin:0 0 4px 0; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#ddb374;">Codice del ticket</p>
												<p style="margin:0; font-size:13px; font-family:'Courier New',Courier,monospace; letter-spacing:0.5px; color:#f6dca0; word-break:break-all;" th:text="${codiceTicket}">codice</p>
											</td>
										</tr>
									</table>
								</td>
								<td width="104" valign="middle" bgcolor="#8083ff" style="background-color:#8083ff; background-image:linear-gradient(160deg,#494bd6,#8083ff); border-left:2px dashed rgba(255,255,255,0.4);">

										<tr>

										</tr>
									</table>
								</td>
							</tr>
							<tr>
								<td bgcolor="#152753" style="background-color:#152753; height:14px; border-radius:0 0 0 12px; line-height:1px; font-size:1px;">&nbsp;</td>
								<td width="104" bgcolor="#8083ff" style="background-color:#8083ff; background-image:linear-gradient(160deg,#494bd6,#8083ff); border-radius:0 0 12px 0; border-left:2px dashed rgba(255,255,255,0.4);">

				<tr>
					<td style="padding:0 32px 32px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif;">

						<p style="margin:0; font-family:Inter,'Segoe UI',Arial,sans-serif; font-size:12px; color:#908fa0;" th:text="${'© ' + #temporals.format(#temporals.createNow(), 'yyyy') + ' NoseY Live Experience System. Tutti i diritti riservati.'}">© 2026 NoseY Live Experience System. Tutti i diritti riservati.</p>
