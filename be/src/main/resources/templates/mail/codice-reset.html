<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8"/>
	<title>Reimposta la password</title>
</head>
<body style="font-family: sans-serif; color: #222;">
	<h1 style="color: #6a2fb0;">Ciao <span th:text="${nome}">nome</span>,</h1>
	<p>Hai chiesto di reimpostare la password del tuo account NoseY. Usa questo codice:</p>
	<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px;" th:text="${codice}">000000</p>
	<p>Il codice scade tra 15 minuti.</p>
	<p>Se non sei stato tu a chiederlo, ignora questa email: la tua password non cambia.</p>
</body>
</html>
