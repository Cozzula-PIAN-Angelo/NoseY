<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta name="color-scheme" content="dark light"/>
	<meta name="supported-color-schemes" content="dark light"/>
	<title>Reimposta la password</title>
</head>
<body style="margin:0; padding:0; background-color:#0f131d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f131d" style="background-color:#0f131d; width:100%;">
	<tr>
		<td align="center" style="padding:32px 16px;">
			<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#111827" style="max-width:600px; width:100%; background-color:#111827; border:1px solid rgba(255,255,255,0.08); border-radius:12px;">
				<tr>
					<td align="center" style="padding:28px 24px 20px 24px; border-bottom:1px solid rgba(255,255,255,0.08);">
						<table role="presentation" cellpadding="0" cellspacing="0" border="0">
							<tr>
								<td valign="middle" style="padding-right:10px;">
									<img src="https://nosey-fe.onrender.com/logo-nosey.png" alt="" width="32" height="32" style="display:block; width:32px; height:32px;"/>
								</td>
								<td valign="middle">
									<span style="font-family:Inter,'Segoe UI',Arial,sans-serif; font-size:24px; font-weight:800; letter-spacing:0.5px; color:#dfe2f1;">Nose<span style="color:#f59e0b;">Y</span></span>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td style="padding:32px 32px 8px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif;">
						<p style="margin:0 0 16px 0; font-size:20px; font-weight:700; color:#dfe2f1;">Ciao <span th:text="${nome}">nome</span>,</p>
						<p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#c7c4d7;">Hai chiesto di reimpostare la password del tuo account NoseY. Usa questo codice:</p>
					</td>
				</tr>
				<tr>
					<td align="center" style="padding:0 32px 24px 32px;">
						<table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b0f19" style="background-color:#0b0f19; border:1px solid rgba(245,158,11,0.35); border-radius:10px;">
							<tr>
								<td style="padding:16px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif; font-size:32px; font-weight:800; letter-spacing:10px; color:#f59e0b;" th:text="${codice}">000000</td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td style="padding:0 32px 32px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif;">
						<p style="margin:0 0 8px 0; font-size:14px; line-height:1.6; color:#c7c4d7;">Il codice scade tra 15 minuti.</p>
						<p style="margin:0; font-size:14px; line-height:1.6; color:#c7c4d7;">Se non sei stato tu a chiederlo, ignora questa email: la tua password non cambia.</p>
					</td>
				</tr>
				<tr>
					<td align="center" style="padding:20px 24px; border-top:1px solid rgba(255,255,255,0.08);">
						<p style="margin:0; font-family:Inter,'Segoe UI',Arial,sans-serif; font-size:12px; color:#908fa0;" th:text="${'© ' + #temporals.format(#temporals.createNow(), 'yyyy') + ' NoseY Live Experience System. Tutti i diritti riservati.'}">© 2026 NoseY Live Experience System. Tutti i diritti riservati.</p>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
